name: Daily Auto Commit

on:
  schedule:
    - cron: "30 18 * * *"   # runs daily at ~00:00 IST (18:30 UTC previous day)
  workflow_dispatch:          # allows manual trigger from the Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update log file
        run: |
          mkdir -p .github/activity
          echo "Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/activity/log.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/activity/log.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: daily activity update"
          git push
